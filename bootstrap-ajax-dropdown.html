<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ajax and Bootstrap demo</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <div class="container py-4">
      <h1>Ajax and Bootstrap demo</h1>
      
      <!-- Dropdown Container -->
      <div class="dropdown my-3" id="myDropdown">
        <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
          Dropdown button
        </button>
        <!-- Dynamic list target -->
        <ul class="dropdown-menu" id="myList"></ul>
      </div>   
    </div>
    
    <!-- Bootstrap 5 JavaScript Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <!-- Ajax / Fetch Implementation -->
    <script>
      const myDropdown = document.getElementById('myDropdown');

      // Listen for Bootstrap's event that fires immediately when the dropdown is clicked
      myDropdown.addEventListener('show.bs.dropdown', event => {
        const myList = document.getElementById('myList');

        // 1. Display spinner inside dropdown menu while loading
        myList.innerHTML = '<li class="p-2"><div class="spinner-border spinner-border-sm" role="status"><span class="visually-hidden">Loading...</span></div></li>';
        
        // 2. Fetch game records from the server
        fetch('ajax.php') // Use relative URL or full mi-linux URL
          // 3. Parse JSON response
          .then(response => response.json())
          .then(response => {
            // 4. Clear the loading spinner
            myList.innerHTML = '';

            // 5. Iterate through data and construct dropdown list elements
            response.forEach(game => {
              var li = document.createElement("li");
              var a = document.createElement("a");
              
              a.innerHTML = game.game_name;
              a.href = '#';
              a.classList.add("dropdown-item");
              
              li.appendChild(a);
              myList.appendChild(li);            
            });
          })
          .catch(err => {
            console.error('Fetch error:', err);
            myList.innerHTML = '<li class="dropdown-item text-danger">Failed to load</li>';
          });
      });
    </script>
  </body>
</html>
